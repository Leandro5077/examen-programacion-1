<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Listado de Categorías</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  </head>
  <body>
    <div class="container mt-4">
      <h1>Categorías</h1>
      <a href="/" class="btn btn-secondary mb-3"
        >Inicio <i class="fas fa-home"></i
      ></a>
      <!-- Formulario de búsqueda -->
      <form method="get" th:action="@{/categories}" class="row mb-3 g-2">
        <div class="col-auto">
          <input
            type="text"
            name="keyword"
            th:value="${keyword}"
            class="form-control"
            placeholder="Buscar por nombre..."
          />
        </div>
        <div class="col-auto">
          <button type="submit" class="btn btn-primary">
            Buscar <i class="fas fa-search"></i>
          </button>
        </div>
        <div class="col-auto">
          <a href="/categories/create" class="btn btn-success"
            >Nuevo <i class="fas fa-plus"></i
          ></a>
        </div>
      </form>
        <!-- Mensaje de éxito -->
      <!-- Tabla de categorías -->
      <table class="table table-bordered table-striped">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="category : ${categoryPage.content}">
            <td th:text="${category.id}"></td>
            <td th:text="${category.name}"></td>
            <td>
              <a
                th:href="@{/categories/edit/{id}(id=${category.id})}"
                class="btn btn-warning"
                title="Editar"
                ><i class="fas fa-edit"></i
              ></a>
              <a
                th:href="@{/categories/delete/{id}(id=${category.id})}"
                class="btn btn-danger"
                title="Eliminar"
                onclick="return confirm('¿Estás seguro de eliminar esta categoría?')"
                ><i class="fas fa-trash"></i
              ></a>
            </td>
          </tr>
      </table>
      <nav>
        <ul class="pagination">
          <li class="page-item" th:classappend="${categoryPage.first} ? 'disabled'">
            <a class="page-link" th:href="@{|/categories?page=${currentPage-1}|}">Anterior</a>
          </li>
          <li
            class="page-item"
            th:each="i : ${#numbers.sequence(0, categoryPage.totalPages-1)}"
            th:classappend="${i == currentPage} ? 'active'"
          >
            <a class="page-link" th:href="@{|/categories?page=${i}|}" th:text="${i + 1}">1</a>
          </li>
          <li class="page-item" th:classappend="${categoryPage.last} ? 'disabled'">
            <a class="page-link" th:href="@{|/categories?page=${currentPage+1}|}">Siguiente</a>
          </li>
        </ul>
      </nav>
    </div>
  </body>
</html>
