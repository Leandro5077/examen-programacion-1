<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Products</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body class="container mt-4">
    <h1>Productos</h1>
    <a href="/" class="btn btn-secondary mb-3"
      >Inicio <i class="fas fa-home"></i
    ></a>
    <form method="get" th:action="@{/products}" class="row mb-3 g-2">
      <div class="col-auto">
        <input
          type="text"
          name="keyword"
          th:value="${keyword}"
          class="form-control"
          placeholder="Buscar por nombre..."
        />
      </div>
      <div class="col-auto">
        <button type="submit" class="btn btn-primary">
          Buscar <i class="fas fa-search"></i>
        </button>
      </div>
      <div class="col-auto">
        <a href="/products/new" class="btn btn-success"
          >Nuevo <i class="fas fa-plus"></i
        ></a>
      </div>
    </form>

    <table class="table table-bordered table-striped">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Categoria</th>
          <th>Precio</th>
          <th>Accioens</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="product : ${productPage.content}">
          <td th:text="${product.id}"></td>
          <td th:text="${product.name}"></td>
          <td th:text="${product.category.name}"></td>
          <td
            th:text="${#numbers.formatDecimal(product.price, 1, 'POINT', 2, 'COMMA')}"
          ></td>
          <td>
            <a
              th:href="@{/products/edit/{id}(id=${product.id})}"
              class="btn btn-warning"
              ><i class="fas fa-edit"></i
            ></a>
            <a
              th:href="@{/products/delete/{id}(id=${product.id})}"
              class="btn btn-danger"
              onclick="return confirm('Are you sure you want to delete this product?');"
              ><i class="fas fa-trash"></i
            ></a>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- Pagination -->
    <nav>
      <ul class="pagination">
        <li
          class="page-item"
          th:classappend="${productPage.first} ? 'disabled'"
        >
          <a class="page-link" th:href="@{|/products?page=${currentPage-1}|}"
            >Anterior</a
          >
        </li>
        <li
          class="page-item"
          th:each="i : ${#numbers.sequence(0, productPage.totalPages-1)}"
          th:classappend="${i == currentPage} ? 'active'"
        >
          <a
            class="page-link"
            th:href="@{|/products?page=${i}|}"
            th:text="${i + 1}"
            >1</a
          >
        </li>
        <li class="page-item" th:classappend="${productPage.last} ? 'disabled'">
          <a class="page-link" th:href="@{|/products?page=${currentPage+1}|}"
            >Siguiente</a
          >
        </li>
      </ul>
    </nav>
  </body>
</html>
